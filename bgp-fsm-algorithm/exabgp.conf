# ExaBGP configuration for testing the BGP FSM speaker.

# ExaBGP (AS 65002, router ID 10.0.0.2) listens on 127.0.0.1:1790
# and waits for our speaker (AS 65001) to connect.

neighbor 127.0.0.1 {
    router-id 10.0.0.2;
    local-as 65002;
    peer-as 65001;
    local-address 127.0.0.1;
    passive;
    listen 1790;
    hold-time 90;

    family {
        ipv4 unicast;
    }
}
